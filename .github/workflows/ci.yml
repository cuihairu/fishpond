name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  structure:
    name: structure (§3.2 members / §3.3 layering)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check workspace structure
        run: python3 scripts/check_workspace.py

  rust:
    name: rust (${{ matrix.os }}, 1.88)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: "1.88.0"
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  node:
    name: node (lint/test/build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Test
        run: pnpm run test
      - name: Build
        run: pnpm run build

  sdk:
    name: sdk (regenerate gate + py/go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
      - name: Regenerate SDKs and diff against committed
        run: |
          python3 scripts/generate_sdk.py \
            --doc crates/server/tests/fixtures/openapi.json \
            --ts packages/sdk/src/client.ts \
            --py sdk/python/fishpond/__init__.py \
            --go sdk/go/client.go \
            --gomod sdk/go/go.mod
          git diff --exit-code
      - name: Generator tests
        run: python3 -m unittest discover -s scripts -v
      - name: Python SDK tests
        run: python3 -m unittest discover -s sdk/python -v
      - name: Go SDK tests
        working-directory: sdk/go
        run: go test ./...
